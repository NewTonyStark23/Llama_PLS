[package]
name = "veloxllm"
version = "0.9.0"
edition = "2021"
authors = ["VeloxLLM Contributors"]
description = "The fastest open-source LLM inference engine - 10x faster than llama.cpp"
license = "MIT"
repository = "https://github.com/veloxllm/veloxllm"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
half = "2.3"
memmap2 = "0.9"
rayon = "1.8"
num_cpus = "1.16"

[[bin]]
name = "veloxllm"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
